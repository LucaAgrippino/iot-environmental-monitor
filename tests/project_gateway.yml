---
# Dedicated Ceedling project for Gateway modules whose production filename
# collides with an identically-named Field Device file (e.g. gpio_driver.c
# exists under both firmware/field-device/drivers/gpio/ and
# firmware/gateway/drivers/gpio/). The real per-board embedded builds never
# see both trees at once, so bare, unsuffixed filenames are fine there —
# but tests/project.yml's :source: globs span both trees for host testing,
# and Ceedling resolves a test's #include to a same-named .c by searching
# that whole pool and taking the first match it finds, with no ambiguity
# detection (see file_finder_helper.rb#find_file_in_collection in the
# ceedling gem). Two identically-named .c files in that pool means one
# board's test would silently compile against the other board's file.
#
# Rather than rename production files to work around a test-tool
# limitation, modules with this collision get their own project file here,
# scoped to only that module's Gateway directory, invoked via:
#   CEEDLING_MAIN_PROJECT_FILE=project_gateway.yml ceedling test:<target>
# (run from tests/, same as the default project). This file is otherwise
# a full, independent Ceedling project — it does not merge with or inherit
# from project.yml.
#
# Add a new module here (its own :paths:source:/:paths:test: entry plus a
# :test_<name>: defines block) only when it has this same collision.
# Modules without a same-named Field Device counterpart do not need this
# and should stay in the default project.yml.

:project:
  :use_exceptions: FALSE
  :use_test_preprocessor: TRUE
  :use_auxiliary_dependencies: TRUE
  :build_root: build_gateway
  :release_build: FALSE
  :test_file_prefix: test_
  :which_ceedling: gem
  :default_tasks:
    - test:all

:paths:
  :test:
    - gateway/drivers/gpio/**
    - gateway/drivers/led/**
    - gateway/middleware/logger/**
    - gateway/drivers/wifi_driver/**
    - gateway/middleware/time_provider/**
    - gateway/application/health_monitor/**
    - gateway/middleware/config_store/**
    # firmware_store: its fakes/, sim/, vectors/ and mbedtls_host/ folders are support
    # code (linked by a test's own #include), not tests, so this entry is not recursive.
    - gateway/middleware/firmware_store
    # internal_flash: the fake/ folder holds the controller model, linked by the test's #include.
    - gateway/drivers/internal_flash
    - gateway/drivers/modbus_uart_driver/**
    - gateway/middleware/modbus_master/**
    - gateway/application/modbus_poller/**
    - gateway/application/sensor_service/**
    - gateway/application/alarm_service/**
    - gateway/application/cloud_publisher/**
    - gateway/application/time_service/**
    - gateway/application/config_service/**
    - gateway/application/console_service/**
    - gateway/application/lifecycle_controller/**
    - gateway/application/lifecycle_wiring/**
    - gateway/middleware/ntp_client/**
    - gateway/drivers/humidity_temp_driver/**
    - gateway/drivers/barometer_driver/**
    - gateway/drivers/i2c/**
    - gateway/drivers/magnetometer_driver/**
    - gateway/drivers/imu_driver/**
    - gateway/system/**
  :source:
    - mocks/**
    - ../firmware/shared/
    - ../firmware/gateway/drivers/gpio/**
    - ../firmware/gateway/Src
    - ../firmware/gateway/drivers/led/**
    - ../firmware/gateway/middleware/logger/**
    - ../firmware/gateway/middleware/time_provider/**
    - ../firmware/gateway/application/health_monitor/**
    - ../firmware/gateway/middleware/config_store/**
    - ../firmware/gateway/middleware/firmware_store/**
    - ../firmware/gateway/middleware/modbus_master/**
    - ../firmware/gateway/application/modbus_poller/**
    - ../firmware/gateway/application/sensor_service/**
    - ../firmware/gateway/application/alarm_service/**
    - ../firmware/gateway/application/cloud_publisher/**
    - ../firmware/gateway/application/time_service/**
    - ../firmware/gateway/application/config_service/**
    - ../firmware/gateway/application/console_service/**
    - ../firmware/gateway/application/lifecycle_controller/**
    - ../firmware/gateway/application/lifecycle_wiring/**
    - ../firmware/gateway/application/device_profile_registry/**
    - ../firmware/gateway/middleware/ntp_client/**
    # health_monitor.h includes the real mqtt_client.h for mqtt_stats_t, which
    # reaches wifi_task.h and wifi_driver.h. Their directories must be include
    # roots; nothing links them because the test never includes them directly.
    - ../firmware/gateway/middleware/mqtt_client/**
    - ../firmware/gateway/middleware/wifi_task/**
    # The whole Gateway drivers tree is added (not just rtc/ and debug_uart/)
    # so that "../firmware/gateway/drivers" itself becomes an include root —
    # logger.c #includes "rtc/rtc.h" and "debug_uart/debug_uart.h", which
    # only resolve if the *parent* of those two folders is on the include
    # path (a glob's pre-"**" prefix, not each leaf folder individually).
    # No collision risk: this project file never references firmware/field-device,
    # so nothing here can collide with an FD basename. test_logger_gw.c includes
    # driver_stubs.h instead of the real rtc.h/debug_uart.h, so Ceedling's
    # auto-link (which scans the *test file's* own includes, not the SUT's)
    # never pulls rtc.c/debug_uart.c into the test_logger_gw executable.
    - ../firmware/gateway/drivers/**
  :support:
    - support
    # FirmwareStore test infrastructure: NOR/ECC flash fakes, the power-cut injector, the
    # fake and real crypto, the bootloader simulator and the generated signed-image vectors.
    - gateway/middleware/firmware_store/fakes
    - gateway/middleware/firmware_store/sim
    - gateway/middleware/firmware_store/mbedtls_host
    - gateway/middleware/firmware_store/vectors
    - gateway/drivers/internal_flash/fake
  # config_store.h includes "health_monitor/health_monitor.h", so the parent of the
  # health_monitor directory has to be an include root.
  # health_monitor.h includes "modbus_master/modbus_master.h", so the parent of that
  # directory has to be an include root as well.
  :include:
    - ../firmware/gateway/application
    - ../firmware/gateway/middleware
    # ota_crypto.c includes mbedtls/*.h (test_fs_crypto_vectors only).
    - ../vendor/mbedtls/include

:defines:
  :common: &common_defines []
  :test:
