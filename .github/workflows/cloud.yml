name: Cloud

# The self-hosted cloud (cloud/) and its broker and certificate authority (broker/). Separate from ci.yml, which
# covers the firmware: this runs only when those folders (or this file) change.
on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - "broker/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "broker/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  python-tests:
    name: Cloud and broker tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the version on the Raspberry Pi (Debian 13); 3.12 is the development machine.
        python: ["3.12", "3.13"]
    env:
      REQUIRE_DOCKER: "1" # the broker tests run a real Mosquitto: a missing Docker must fail, not skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            cloud/backend/pyproject.toml
            broker/requirements.txt

      - name: Install
        run: pip install -e 'cloud/backend[test]' -r broker/requirements.txt

      - name: Pull the broker image
        run: docker pull eclipse-mosquitto:2

      - name: Backend tests (ingest, API, commands, OTA, login)
        run: python -m pytest cloud/backend -q

      - name: Broker tests (certificate authority, real Mosquitto with the access list)
        run: python -m pytest broker -q

  web-build:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: cloud/web/dist
          retention-days: 7

  deploy-checks:
    name: Installers and the whole chain (Debian 13 containers)
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e 'cloud/backend[test]' -r broker/requirements.txt

      - name: Use the web build of the previous job
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: cloud/web/dist

      - name: Cloud installer (bundle, install, user, start, login)
        run: cloud/deploy/test-install.sh

      - name: Broker installer (replace the bench configuration, talk through it, roll back)
        env:
          CLOUD_PY: python
        run: broker/test-install-broker.sh

      - name: Backend, simulator and OTA through the secured broker
        env:
          CLOUD_PY: python
        run: broker/test-e2e.sh

      - name: Alerts, with a real ntfy server (alarm, silent device)
        env:
          CLOUD_PY: python
        run: cloud/dev/test-alerts.sh

  markdown:
    name: Markdown lint (cloud, broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            cloud/**/*.md
            broker/**/*.md
            !cloud/web/node_modules
