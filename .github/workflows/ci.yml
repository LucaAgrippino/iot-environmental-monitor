name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests (Ceedling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: false

      - name: Install Ceedling
        run: gem install ceedling -v 0.31.1

      - name: Generate firmware_version.h
        run: python3 scripts/gen-version.py firmware/shared/firmware_version.h.in firmware/shared/firmware_version.h

      - name: Run tests
        working-directory: tests
        run: ceedling test:all

  firmware-build:
    name: Firmware build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: f469
            project_path: firmware/field-device
            project_target: field-device/Debug
          - target: l475
            project_path: firmware/gateway
            project_target: gateway/Debug
          # The production image (Release): Src/main.c and every module, no harness (build-configurations.md).
          - target: l475-release
            project_path: firmware/gateway
            project_target: gateway/Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate firmware_version.h
        run: python3 scripts/gen-version.py firmware/shared/firmware_version.h.in firmware/shared/firmware_version.h

      - name: Generate firmware_version.h
        run: python3 scripts/gen-version.py firmware/shared/firmware_version.h.in firmware/shared/firmware_version.h

      # The production main needs the git-ignored credential headers. CI has none, so it builds with
      # placeholders: the image compiles, links and has the right size, but cannot connect.
      - name: Placeholder credential headers
        if: matrix.target == 'l475-release'
        run: bash scripts/make-placeholder-bringup-headers.sh

      - name: Build with STM32CubeIDE
        uses: xanderhendriks/action-build-stm32cubeide@v15.0
        with:
          project-path: ${{ matrix.project_path }}
          project-target: ${{ matrix.project_target }}

  build-exclusions:
    name: Build configurations (one main() each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The configurations CI builds: Debug and Release on the Gateway, Debug on the Field Device
      # (its Release is stale: build-configurations.md section 7).
      - name: Check that each configuration compiles exactly one main()
        run: |
          python3 scripts/check-build-exclusions.py --config Debug --config Release firmware/gateway
          python3 scripts/check-build-exclusions.py --config Debug firmware/field-device

  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Generate firmware_version.h
        run: python3 scripts/gen-version.py firmware/shared/firmware_version.h.in firmware/shared/firmware_version.h

      - name: Run cppcheck
        run: |
          sources=$(find firmware \
            \( -path '*/drivers/*' -o -path '*/middleware/*' -o -path '*/application/*' \
               -o -path '*/integration-tests/*' \) \
            \( -name '*.c' -o -name '*.h' \) 2>/dev/null || true)
          if [ -z "$sources" ]; then
            echo "cppcheck: no project source files found — skipping"
            exit 0
          fi
          echo "$sources" | xargs cppcheck \
            --enable=style,warning,performance \
            -I firmware/shared \
            --suppressions-list=cppcheck-suppressions.txt \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --error-exitcode=1

  clang-format-check:
    name: Formatting check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-17
        run: sudo apt-get install -y clang-format-17

      - name: Check formatting
        run: |
          files=$(find firmware \
            \( -path '*/drivers/*' -o -path '*/middleware/*' -o -path '*/application/*' \
               -o -path '*/integration-tests/*' \) \
            \( -name '*.c' -o -name '*.h' \) 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "clang-format: no project source files found — skipping"
            exit 0
          fi
          echo "$files" | xargs clang-format-17 --dry-run --Werror

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md

