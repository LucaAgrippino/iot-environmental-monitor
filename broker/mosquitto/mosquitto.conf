# Broker of the IoT Environmental Monitor: one door, TLS 1.2 with mutual authentication.
#   - every client (device, cloud, operator tool) must present a certificate signed by our CA (iotpki.py);
#   - the certificate's common name is the user name, and acl.conf says what that name may do;
#   - a revoked certificate (crl.pem) is refused at the handshake.
# Paths below are for the Pi install (broker/install-broker.sh); the test and the dev stack mount their own.
listener 8883 0.0.0.0
cafile /etc/mosquitto/iot/ca.crt
certfile /etc/mosquitto/iot/server.crt
keyfile /etc/mosquitto/iot/server.key
crlfile /etc/mosquitto/iot/crl.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
tls_version tlsv1.2
acl_file /etc/mosquitto/iot/acl.conf

# Limits that cost nothing and bound what a misbehaving client can do. An OTA chunk is 1 KB + 8 bytes.
max_packet_size 65536
max_connections 50
max_queued_messages 1000
allow_zero_length_clientid false

persistence true
persistence_location /var/lib/mosquitto/
log_type error
log_type warning
log_type notice
