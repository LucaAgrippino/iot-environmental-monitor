# Who may do what. The user name is the common name of the client certificate (use_identity_as_username).
# A name with no rule below may do nothing. The same shape is an AWS IoT policy with ${iot:Connection.Thing.ThingName}.

# The cloud backend: reads everything the devices send, sends commands to any device.
user iotcloud
topic read  dt/iotmonitor/+/#
topic write cmd/iotmonitor/+/#

# The OTA command-line tool (scripts/ota_server.py): the OTA conversation and nothing else.
user ota-operator
topic write cmd/iotmonitor/+/ota
topic write cmd/iotmonitor/+/ota/data
topic read  dt/iotmonitor/+/ota/request
topic read  dt/iotmonitor/+/ota/result

# Every other name is a device. %u is the certificate's common name, i.e. the device serial. (The bench ACL used
# %c, the MQTT client id: a client chooses that itself, so a device could have claimed another one's topics.)
pattern read  cmd/iotmonitor/%u/#
pattern write dt/iotmonitor/%u/#
