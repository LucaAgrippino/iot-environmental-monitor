<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Liberation Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="6" y="6" width="848" height="262" rx="12" fill="#FDE8E855" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="18" y="22" text-anchor="start" font-size="11.5" font-weight="700" font-style="normal" fill="#C0392B">1. Who is this program, and what may it do?  (certificates + access list)</text>
<rect x="24" y="110" width="190" height="66" rx="9" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="119.0" y="128" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Our Certificate Authority</text>
<text x="119.0" y="143" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">~/.iot-pki/ca</text>
<text x="119.0" y="156" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">key is encrypted</text>
<rect x="300" y="36" width="210" height="46" rx="9" fill="#E4F6E8" stroke="#2E8B57" stroke-width="1.6"/>
<text x="405.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Broker certificate</text>
<rect x="300" y="96" width="210" height="46" rx="9" fill="#EEE8FA" stroke="#6B4FB3" stroke-width="1.6"/>
<text x="405.0" y="123.0" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Backend certificate: iotcloud</text>
<rect x="300" y="156" width="210" height="46" rx="9" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="405.0" y="183.0" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Operator certificate: ota-operator</text>
<rect x="300" y="216" width="210" height="46" rx="9" fill="#E3F0FF" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="405.0" y="243.0" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Device certificate (its serial)</text>
<path d="M214,143 L300,59" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="250" y="85" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#222" style="paint-order:stroke" stroke="#fff" stroke-width="3.5">signs</text>
<path d="M214,143 L300,119" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M214,143 L300,179" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M214,143 L300,239" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="610" y="96" width="230" height="110" rx="9" fill="#E4F6E8" stroke="#2E8B57" stroke-width="1.6"/>
<text x="725.0" y="114" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Access list (acl.conf)</text>
<text x="725.0" y="129" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">each NAME may publish and</text>
<text x="725.0" y="142" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">read only certain topics.</text>
<text x="725.0" y="155" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">Name = the certificate&#x27;s</text>
<text x="725.0" y="168" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">common name</text>
<path d="M510,119 H610" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M510,179 H560 L610,165" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M510,239 H570 L610,190" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="560" y="76" text-anchor="middle" font-size="10.5" font-weight="400" font-style="italic" fill="#2E8B57">&#x27;I am the broker&#x27;:</text>
<text x="560" y="89" text-anchor="middle" font-size="10.5" font-weight="400" font-style="italic" fill="#2E8B57">devices check this one</text>
<rect x="6" y="280" width="420" height="180" rx="12" fill="#E3F0FF55" stroke="#2F6DB5" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="18" y="296" text-anchor="start" font-size="11.5" font-weight="700" font-style="normal" fill="#2F6DB5">2. Is this firmware genuine?</text>
<rect x="24" y="312" width="170" height="56" rx="9" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="109.0" y="330" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Release signing key</text>
<text x="109.0" y="345" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">private, on the PC</text>
<rect x="240" y="312" width="170" height="56" rx="9" fill="#E3F0FF" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="325.0" y="330" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Public half</text>
<text x="325.0" y="345" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">built into the firmware</text>
<path d="M194,340 H240" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="217" y="331" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#222" style="paint-order:stroke" stroke="#fff" stroke-width="3.5">matching pair</text>
<text x="216" y="400" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">Every update&#x27;s header is signed with the private key.</text>
<text x="216" y="415" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">The Gateway checks it with the public half</text>
<text x="216" y="430" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">before installing anything. A different key from the CA.</text>
<rect x="438" y="280" width="416" height="180" rx="12" fill="#FFF1DD55" stroke="#C77B12" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="450" y="296" text-anchor="start" font-size="11.5" font-weight="700" font-style="normal" fill="#C77B12">3. Who is the person at the web page?</text>
<rect x="456" y="312" width="170" height="56" rx="9" fill="#FFF1DD" stroke="#C77B12" stroke-width="1.6"/>
<text x="541.0" y="330" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Caddy&#x27;s own small CA</text>
<text x="541.0" y="345" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">certificate for envmon.lan</text>
<rect x="672" y="312" width="166" height="56" rx="9" fill="#FFF1DD" stroke="#C77B12" stroke-width="1.6"/>
<text x="755.0" y="330" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Browser</text>
<text x="755.0" y="345" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">imported Caddy&#x27;s root once</text>
<path d="M626,340 H672" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="649" y="331" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#222" style="paint-order:stroke" stroke="#fff" stroke-width="3.5">trusted</text>
<rect x="456" y="392" width="382" height="56" rx="9" fill="#FFF1DD" stroke="#C77B12" stroke-width="1.6"/>
<text x="647.0" y="410" text-anchor="middle" font-size="12.5" font-weight="700" font-style="normal" fill="#222">Login</text>
<text x="647.0" y="425" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#333">user + password (scrypt) → session cookie, roles admin / viewer</text>
</svg>