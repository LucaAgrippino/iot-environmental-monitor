<text x="826.0" y="259" text-anchor="middle" font-size="11.5" fill="#111"><tspan font-weight="700" fill="#6B4FB3">6</tspan>  push notification</text>
<rect x="794.4000000000001" y="282" width="171.6" height="22" rx="4" fill="#FFFBE6" stroke="#D9C46B"/>
<text x="880.2" y="297" text-anchor="middle" font-size="11" fill="#333">&#x27;Temperature HIGH on &lt;id&gt;&#x27;</text>
<line x1="14" y1="318" x2="966" y2="318" stroke="#999" stroke-dasharray="2 3"/>
<text x="490.0" y="332" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555" style="paint-order:stroke" stroke="#fff" stroke-width="4">if the Gateway goes silent: the watcher thread sends &#x27;device offline&#x27; once, and &#x27;back online&#x27; once</text>
