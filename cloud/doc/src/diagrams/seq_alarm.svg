<text x="154.0" y="95" text-anchor="middle" font-size="11.5" fill="#111"><tspan font-weight="700" fill="#6B4FB3">1</tspan>  PUBLISH dt/iotmonitor/&lt;id&gt;/alarms  {sensor, type HIGH, value, limit}  (QoS 1)</text>
<line x1="238.0" y1="130" x2="406.0" y2="130" stroke="#444" stroke-width="1.3" marker-end="url(#ar)"/>
