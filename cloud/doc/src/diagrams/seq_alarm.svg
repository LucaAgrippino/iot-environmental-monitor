<rect x="14.0" y="58" width="191.39999999999998" height="22" rx="4" fill="#FFFBE6" stroke="#D9C46B"/>
<text x="109.69999999999999" y="73" text-anchor="middle" font-size="11" fill="#333">temperature crosses the limit</text>
