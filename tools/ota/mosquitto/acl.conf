# Mosquitto ACL for the OTA system test (docs/lld/application/update-service-lld.md section 23.3).
# Only the operator identity may publish to the OTA command topics (REQ-DM-056, US-O5). The user
# name is the common name of the client certificate (use_identity_as_username true).
#
# A device may read its own command topics and write only under its own dt/ prefix. %c is the MQTT
# client id, which is the device serial (the CPU unique id, CP-D33).

user ota-operator
topic write cmd/iotmonitor/+/ota
topic write cmd/iotmonitor/+/ota/data
topic read  dt/iotmonitor/+/ota/request
topic read  dt/iotmonitor/+/ota/result

pattern read  cmd/iotmonitor/%c/#
pattern write dt/iotmonitor/%c/#
